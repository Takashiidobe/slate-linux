[build]
target = "x86_64-unknown-none"
rustflags = ["-Crelocation-model=static", "-Zcf-protection=branch", "-Zretpoline-external-thunk", "-Zfunction-return=thunk-extern", "-Zindirect-branch-cs-prefix", "-Ctarget-feature=-x87", "-Zmerge-functions=disabled", "-Zplt=yes", "-Zunstable-options", "-Cpanic=immediate-abort"]

[unstable]
build-std = ["core", "compiler_builtins"]
